<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Seojin Tech CNC HMI — Demo</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #0d1117;
  display: flex;
  height: 100vh;
  overflow: hidden;
  font-family: "Pretendard", "Malgun Gothic", sans-serif;
  color: #c5d0de;
}

/* ── Sidebar ── */
.sidebar {
  width: 220px;
  flex-shrink: 0;
  background: #111820;
  border-right: 1px solid rgba(255,255,255,.06);
  display: flex;
  flex-direction: column;
}

.sidebar-head {
  padding: 14px 16px 12px;
  border-bottom: 1px solid rgba(255,255,255,.06);
  flex-shrink: 0;
}

.back-link {
  font-size: .72rem;
  color: #455060;
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 4px;
  margin-bottom: 8px;
  transition: color .12s;
}
.back-link:hover { color: #3974CC; }

.sidebar-title {
  font-size: .68rem;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: #3974CC;
}

.screen-list {
  flex: 1;
  overflow-y: auto;
  padding: 6px 0 12px;
}
.screen-list::-webkit-scrollbar { width: 3px; }
.screen-list::-webkit-scrollbar-thumb { background: #202c3a; border-radius: 2px; }

.group-label {
  padding: 14px 14px 4px;
  font-size: .62rem;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: #253040;
}

.screen-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  cursor: pointer;
  font-size: .76rem;
  color: #6a7a8c;
  border-left: 2px solid transparent;
  transition: background .1s, color .1s, border-color .1s;
  line-height: 1.3;
}
.screen-item:hover { background: rgba(57,116,204,.07); color: #c5d0de; }
.screen-item.active {
  background: rgba(57,116,204,.13);
  color: #e4ecf5;
  border-left-color: #3974CC;
}

.screen-num {
  font-size: .6rem;
  color: #2b3a4a;
  min-width: 16px;
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}
.screen-item.active .screen-num { color: #3974CC; }

/* ── Main viewer ── */
.main {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  padding: 12px;
}

.hmi-wrap {
  overflow: hidden;
  border-radius: 4px;
  box-shadow: 0 20px 60px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.05);
  flex-shrink: 0;
}

.hmi-wrap iframe {
  display: block;
  width: 1920px;
  height: 1080px;
  border: none;
  transform-origin: top left;
  background: #1D2329;
}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-head">
    <a class="back-link" href="index.html">← 목록으로</a>
    <div class="sidebar-title">HMI Screens</div>
  </div>
  <div class="screen-list" id="screenList"></div>
</aside>

<main class="main">
  <div class="hmi-wrap" id="hmiWrap">
    <iframe src="publish/html/main(ex).html" id="hmiFrame"></iframe>
  </div>
</main>

<script>
var SCREENS = [
  { group: 'Main' },
  { label: 'INTRO',              file: 'main(ex).html' },

  { group: 'T-MASTER' },
  { label: 'T-MASTER 1p',        file: 't-master.html' },
  { label: 'T-MASTER 셀 터치시',  file: 't-master(2).html' },
  { label: 'T-MASTER NUM 항목',   file: 't-master(3).html' },
  { label: 'T-MASTER 3-1',       file: 't-master(3_1).html' },
  { label: 'T-MASTER 3-2',       file: 't-master(3_2).html' },

  { group: 'Control' },
  { label: 'XYZ',                file: 'xyz.html' },
  { label: 'Handle',             file: 'handle.html' },
  { label: 'Popup',              file: 'popup.html' },
  { label: 'Parameter-MASTER',   file: 'parameter.html' },

  { group: 'Data / File' },
  { label: 'Data-MASTER',        file: 'data-master.html' },
  { label: 'Data-Parameter',     file: 'data-parameter.html' },
  { label: 'File-MASTER',        file: 'file-master.html' },
  { label: 'File-MASTER Save',   file: 'file-master-save.html' },

  { group: 'I/O' },
  { label: 'I/O Manager',        file: 'io-manager.html' },
  { label: 'I/O Name',           file: 'io-name.html' },
  { label: 'I/O Name — Input',   file: 'io-name-input.html' },
  { label: 'I/O Name — Output',  file: 'io-name-output.html' },

  { group: 'Settings' },
  { label: 'Tool-MASTER',        file: 'tool-master.html' },
  { label: 'Master',             file: 'master.html' },
];

var W = 1920, H = 1080;
var frame   = document.getElementById('hmiFrame');
var wrap    = document.getElementById('hmiWrap');
var list    = document.getElementById('screenList');
var activeEl = null;
var idx = 0;

SCREENS.forEach(function (s) {
  if (s.group) {
    var g = document.createElement('div');
    g.className = 'group-label';
    g.textContent = s.group;
    list.appendChild(g);
    return;
  }
  idx++;
  var n = idx;
  var item = document.createElement('div');
  item.className = 'screen-item';
  item.innerHTML =
    '<span class="screen-num">' + String(n).padStart(2, '0') + '</span>' +
    '<span>' + s.label + '</span>';
  item.addEventListener('click', function () {
    if (activeEl) activeEl.classList.remove('active');
    activeEl = item;
    item.classList.add('active');
    frame.src = 'publish/html/' + s.file;
  });
  if (n === 1) { item.classList.add('active'); activeEl = item; }
  list.appendChild(item);
});

function fit() {
  var pad = 24;
  var sideW = 220;
  var availW = window.innerWidth  - sideW - pad;
  var availH = window.innerHeight - pad;
  var scale  = Math.min(availW / W, availH / H);
  frame.style.transform = 'scale(' + scale + ')';
  wrap.style.width  = Math.round(W * scale) + 'px';
  wrap.style.height = Math.round(H * scale) + 'px';
}
fit();
window.addEventListener('resize', fit);
</script>
</body>
</html>
